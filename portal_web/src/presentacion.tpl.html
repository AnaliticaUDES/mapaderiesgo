<title>Mapa de Riesgo Académico 2026-2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: diapositivas 16:9 diseñadas en un lienzo fijo (1280x720; 640xN en vertical) que se escala al viewport.
   Un solo color de alerta (granate) = "reprobación >= 50 %"; un solo azul petróleo = volumen/tasa. Todo lo demás es tinta neutra. */
:root{
  --bg:#F3F5F7; --bg-outer:#E4E9ED; --surface:#FFFFFF; --ink:#0F1D27; --ink-2:#465662; --line:#CFD7DD; --track:#E3E8EC;
  --data:#1E6E8C; --alert:#B3261E; --alert-soft:#F3D6D2; --warn:#84550A; --ok:#1B6A48; --dot:#B7C2CA;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1519; --bg-outer:#070C0F; --surface:#15212A; --ink:#E9EFF3; --ink-2:#9DAEBA; --line:#2A3B47; --track:#1F2E38;
    --data:#67B6D1; --alert:#FF8172; --alert-soft:#4A2622; --warn:#E3B341; --ok:#5CC796; --dot:#33444F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1519; --bg-outer:#070C0F; --surface:#15212A; --ink:#E9EFF3; --ink-2:#9DAEBA; --line:#2A3B47; --track:#1F2E38;
  --data:#67B6D1; --alert:#FF8172; --alert-soft:#4A2622; --warn:#E3B341; --ok:#5CC796; --dot:#33444F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-outer);color:var(--ink);font:400 16px/1.4 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--data);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#main{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg-outer)}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--bg);overflow:hidden}
#progress{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;background:transparent;z-index:5;pointer-events:none}
#progress i{display:block;height:100%;background:var(--alert);transform-origin:0 50%;transform:scaleX(.09)}

/* ---------- Slide base (px del lienzo) ---------- */
.slide{position:absolute;inset:0;padding:44px 72px 72px;display:flex;flex-direction:column;gap:18px;visibility:hidden;opacity:0;overflow:hidden}
.kicker{margin:0;font:500 15px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
.hd{display:flex;flex-direction:column;gap:12px}
.hd h2{font-weight:700;font-size:40px;line-height:1.08;letter-spacing:-.02em;max-width:32ch}
.sub{margin:0;font-size:20px;line-height:1.35;color:var(--ink-2);max-width:62ch}
.bd{flex:1;min-height:0;display:grid}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.mono{font-family:var(--f-mono)}
.al{color:var(--alert)} .dt{color:var(--data)}
.lab{font:500 14px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.note{margin:0;font-size:18px;line-height:1.4;color:var(--ink-2);max-width:70ch}
.note b{color:var(--ink);font-weight:600}
.track{position:relative;background:var(--track);border-radius:0 5px 5px 0;height:26px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--data);border-radius:0 5px 5px 0}
.fill.a{background:var(--alert)}

/* Portada */
.s-cover{padding:64px 80px 84px}
.cover{flex:1;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:32px}
.cv-left{display:flex;flex-direction:column;gap:22px}
.cover h1{font-weight:700;font-size:76px;line-height:.98;letter-spacing:-.035em}
.cv-sub{margin:0;font-size:26px;line-height:1.3;color:var(--ink-2);max-width:26ch}
.badge{align-self:flex-start;margin:6px 0 0;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 14px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.cv-mark{display:flex;align-items:baseline;justify-content:flex-end;color:var(--alert);font-family:var(--f-display);font-weight:800;line-height:.8;letter-spacing:-.05em;white-space:nowrap}
.cv-mark .ge{font-size:150px;opacity:.55;margin-right:6px}
.cv-mark .n{font-size:300px;font-variant-numeric:tabular-nums}
.cv-mark .pc{font-size:120px;margin-left:8px}
.cv-foot{position:absolute;left:80px;right:80px;bottom:44px;display:flex;gap:28px;flex-wrap:wrap;font:500 14px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

/* Mensaje clave */
.s-key .bd{grid-template-columns:1.25fr 1fr;gap:44px}
.dotcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;min-height:0}
.dotwrap{position:relative;min-height:0}
.dotwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{margin:0;display:flex;gap:22px;flex-wrap:wrap;font-size:16px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;background:var(--dot);display:inline-block}
.sw.h{background:var(--alert)}
.keycol{display:flex;flex-direction:column;justify-content:center;gap:28px}
.keybig{display:flex;flex-direction:column;gap:8px}
.keybig .num{font-size:150px;color:var(--alert)}
.keybig p{margin:0;font-size:22px;line-height:1.3}
.why{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:8px}
.why p{margin:0;font-size:19px;line-height:1.4;color:var(--ink-2)}

/* Indicadores */
.s-kpi .bd{grid-template-columns:.9fr 1.1fr;gap:40px;align-items:center}
.donutwrap{position:relative;width:340px;height:340px;justify-self:center}
.donutwrap svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.donutwrap circle{fill:none;stroke-width:16}
.donutwrap .tr{stroke:var(--track)} .donutwrap .vl{stroke:var(--alert);stroke-linecap:butt}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.dcenter .num{font-size:64px}
.dcenter span{font-size:16px;color:var(--ink-2);max-width:14ch;line-height:1.25}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.tile .num{font-size:54px}
.tile span{font-size:17px;color:var(--ink-2);line-height:1.25}
.tile.hot .num{color:var(--alert)}

/* Filas de barras (campus / programas / cursos) */
.rows{display:flex;flex-direction:column;gap:14px;align-self:start}
.rowhead,.crow{display:grid;grid-template-columns:190px 1fr 1fr;column-gap:36px;align-items:center}
.rowhead{padding-bottom:4px;border-bottom:1px solid var(--line)}
.crow .nm{display:flex;flex-direction:column;gap:2px;font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.01em}
.crow .nm small{font:400 15px/1.2 var(--f-body);color:var(--ink-2);letter-spacing:0}
.bcell{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.bcell .v{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:right}
.crow .track{height:32px}

.prow{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) 46px 86px;column-gap:22px;align-items:center;min-height:30px}
.prow.ph{border-bottom:1px solid var(--line);min-height:0;padding-bottom:6px}
.prow .pn{font-size:18px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn small{margin-left:8px;font:400 14px/1.2 var(--f-body);color:var(--ink-2)}
.portrait .prow .pn{white-space:normal}
.prow .track{height:20px}
.prow .cnt{font-family:var(--f-display);font-weight:700;font-size:26px;text-align:right;font-variant-numeric:tabular-nums}
.prow .rt{font:500 16px/1 var(--f-mono);text-align:right;color:var(--ink-2)}
.prow.ph span{font:500 13px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.prow.ph .r{text-align:right}

/* Dispersión */
.s-sc .bd{grid-template-columns:1.6fr 1fr;gap:40px}
.plotbox{position:relative;min-height:0;padding:6px 14px 46px 64px}
.plot{position:relative;width:100%;height:100%;border-left:1px solid var(--ink-2);border-bottom:1px solid var(--ink-2)}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.gl i,.tx{position:absolute;font:400 13px/1 var(--f-mono);color:var(--ink-2)}
.gl i{right:calc(100% + 10px);top:-7px;font-style:normal}
.tx{top:calc(100% + 10px);transform:translateX(-50%)}
.ax{position:absolute;font:500 13px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.ax.x{left:64px;right:14px;bottom:0;text-align:center}
.ax.y{left:0;top:6px;bottom:46px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;white-space:nowrap}
.pt{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--data);opacity:.85;box-shadow:0 0 0 2px var(--bg);cursor:default}
.pt:hover,.pt:focus-visible{opacity:1;outline:2px solid var(--ink);outline-offset:2px}
.plab{position:absolute;font:500 14px/1.1 var(--f-body);color:var(--ink);white-space:nowrap;pointer-events:none}
.plab.l{transform:translate(-100%,-50%);margin-left:-14px} .plab.r{transform:translate(0,-50%);margin-left:14px}
.calls{display:flex;flex-direction:column;justify-content:center;gap:26px}
.call{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.call .num{font-size:52px}
.call p{margin:0;font-size:18px;line-height:1.35;color:var(--ink-2)}
.call p b{color:var(--ink)}

/* Histograma */
.s-hist .bd{grid-template-columns:1.6fr 1fr;gap:44px}
.hist{display:grid;grid-template-columns:repeat(5,1fr);column-gap:18px;min-height:0;padding-bottom:0}
.hcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-height:0}
.harea{position:relative;border-bottom:1px solid var(--ink-2)}
.hbar{position:absolute;left:0;right:0;bottom:0;border-radius:5px 5px 0 0;background:var(--alert)}
.hn{position:absolute;left:0;right:0;text-align:center;font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.hl{text-align:center;font:500 15px/1.2 var(--f-mono);color:var(--ink-2)}

/* Cursos críticos */
.crs{display:flex;flex-direction:column;gap:8px;align-self:start}
.cr{display:grid;grid-template-columns:132px minmax(0,1fr) 190px;column-gap:20px;align-items:center;min-height:50px}
.cr .rate{font-family:var(--f-display);font-weight:700;font-size:36px;color:var(--alert);font-variant-numeric:tabular-nums;text-align:right;letter-spacing:-.02em;white-space:nowrap}
.cr .cm{min-width:0;display:flex;flex-direction:column;gap:4px}
.cr .cn{font-weight:600;font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .cmeta{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .track{height:6px;border-radius:0 3px 3px 0;margin-top:2px}
.cr .fill{border-radius:0 3px 3px 0}
.cr .cs{white-space:nowrap;font:500 14px/1.3 var(--f-mono);color:var(--ink-2);text-align:right}
.cr .cs b{color:var(--ink);font-weight:500}

/* Calidad */
.s-q .bd{grid-template-rows:auto 1fr;gap:26px}
.cov{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.cv{display:flex;flex-direction:column;gap:8px}
.cv .top{display:flex;justify-content:space-between;align-items:baseline}
.cv .top .num{font-size:42px}
.cv .track{height:14px}
.cv small{font-size:15px;color:var(--ink-2)}
.checks{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:14px}
.chk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.chk .num{font-size:40px}
.chk span.d{font-size:16px;line-height:1.3;color:var(--ink-2)}
.st{align-self:flex-start;font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid currentColor}
.st.ok{color:var(--ok)} .st.wr{color:var(--warn)} .st.in{color:var(--data)}

/* Alcance */
.s-scope .bd{grid-template-columns:repeat(3,1fr);gap:26px;align-items:stretch}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 28px 26px;display:flex;flex-direction:column;gap:16px}
.sc svg{width:44px;height:44px;stroke:var(--data);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sc h3{margin:0;font:700 30px/1.1 var(--f-display);letter-spacing:-.01em}
.sc p{margin:0;font-size:20px;line-height:1.4;color:var(--ink-2)}
.files{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.files span{font:400 13px/1 var(--f-mono);padding:6px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);background:var(--surface)}

/* Cierre */
.s-end .bd{grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.col h3{margin:0 0 14px;font:500 14px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);padding-bottom:10px;border-bottom:1px solid var(--line)}
.col.sug h3{color:var(--warn)}
.col ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.col li{font-size:20px;line-height:1.35}
.col li b{font-weight:600}
.col li small{display:block;margin-top:4px;font-size:15px;color:var(--ink-2)}

/* ---------- Portrait: mismo contenido, reacomodado ---------- */
.portrait .slide{padding:38px 34px 84px;gap:16px}
.portrait .hd h2{font-size:31px;max-width:none}
.portrait .sub{font-size:17px}
.portrait .kicker{font-size:13px}
.portrait .s-cover{padding:56px 34px 96px}
.portrait .cover{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:center;gap:40px}
.portrait .cover h1{font-size:60px}
.portrait .cv-sub{font-size:23px;max-width:none}
.portrait .cv-mark{justify-content:flex-start}
.portrait .cv-mark .ge{font-size:100px} .portrait .cv-mark .n{font-size:200px} .portrait .cv-mark .pc{font-size:80px}
.portrait .cv-foot{left:34px;right:34px;bottom:56px;font-size:12px;gap:16px}
.portrait .s-key .bd{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:22px}
.portrait .keybig .num{font-size:100px}
.portrait .keybig p{font-size:19px}
.portrait .keycol{gap:16px}
.portrait .s-kpi .bd{grid-template-columns:1fr;gap:24px;align-content:start}
.portrait .donutwrap{width:280px;height:280px}
.portrait .dcenter .num{font-size:54px}
.portrait .tile{padding:14px 16px}.portrait .tile .num{font-size:38px}.portrait .tile span{font-size:15px}
.portrait .rowhead{display:none}
.portrait .crow{grid-template-columns:1fr;row-gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.portrait .crow .nm{flex-direction:row;align-items:baseline;gap:12px}
.portrait .bcell{grid-template-columns:120px 1fr auto}
.portrait .bcell::before{content:attr(data-l);font:500 12px/1.1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);order:-1}
.portrait .prow{grid-template-columns:minmax(0,1fr) 40px 70px;grid-template-areas:"n c r" "t t t";row-gap:6px}
.portrait .prow .pn{grid-area:n;font-size:17px}.portrait .prow .track{grid-area:t;height:12px}.portrait .prow .cnt{grid-area:c}.portrait .prow .rt{grid-area:r}
.portrait .prow.ph{display:none}
.portrait .s-sc .bd{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:18px}
.portrait .calls{flex-direction:row;gap:18px}.portrait .call{flex:1}.portrait .call .num{font-size:38px}.portrait .call p{font-size:15px}
.portrait .plotbox{padding-left:52px}.portrait .ax.x{left:52px}
.portrait .s-hist .bd{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:20px}
.portrait .hn{font-size:24px}.portrait .hl{font-size:12px}
.portrait .cr{grid-template-columns:100px minmax(0,1fr);row-gap:0;column-gap:14px;min-height:0;padding-bottom:6px}
.portrait .cr .rate{font-size:26px}.portrait .cr .cs{display:none}
.portrait .crs{gap:12px}
.portrait .cr .cn{white-space:normal}
.portrait .cov{grid-template-columns:1fr;gap:12px}
.portrait .cv .top .num{font-size:32px}
.portrait .checks{grid-template-columns:1fr 1fr;gap:10px}.portrait .chk{padding:12px 14px}.portrait .chk .num{font-size:30px}.portrait .chk span.d{font-size:13.5px}
.portrait .s-q .bd{grid-template-rows:auto auto;align-content:start}
.portrait .s-scope .bd{grid-template-columns:1fr;gap:14px;align-content:start}
.portrait .sc{padding:18px 20px;gap:10px}.portrait .sc h3{font-size:24px}.portrait .sc p{font-size:16px}.portrait .sc svg{width:34px;height:34px}
.portrait .s-end .bd{grid-template-columns:1fr;gap:22px}
.portrait .col li{font-size:17px}

/* ---------- Cromo de la app (px reales) ---------- */
#chrome{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line);box-shadow:0 6px 24px rgb(0 0 0/.12);transition:opacity .3s var(--ease)}
#chrome.idle{opacity:0;pointer-events:none}
#chrome button{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background-color .15s,transform .12s var(--ease)}
#chrome button:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){#chrome button:hover{background:var(--track)}}
#chrome svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#count{min-width:64px;text-align:center;font:500 14px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:0 6px}
#chrome .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#toast{position:absolute;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font:500 14px/1.3 var(--f-body);opacity:0;visibility:hidden;max-width:calc(100% - 32px);text-align:center}

#notes{position:fixed;left:0;right:0;bottom:0;height:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);overflow:hidden;visibility:hidden}
#notes .in{height:100%;padding:14px max(20px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 240px;gap:24px;overflow:auto}
#notes p{margin:0;font-size:16px;line-height:1.5;max-width:90ch}
#notes .side{display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--line);padding-left:20px}
#notes .side b{font:500 24px/1 var(--f-mono);font-variant-numeric:tabular-nums}
#notes .side span{font-size:14px;color:var(--ink-2)}
@media (max-width:640px){#notes .in{grid-template-columns:1fr}#notes .side{border:0;padding:0;flex-direction:row;gap:14px;align-items:baseline;flex-wrap:wrap}}

#overview{position:fixed;inset:0;z-index:9;background:var(--bg-outer);visibility:hidden;opacity:0;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 20px 28px}

.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;min-height:168px;aspect-ratio:16/9}

.card[aria-current="true"]{outline:2px solid var(--alert);outline-offset:0}
@media (hover:hover) and (pointer:fine){.card:hover{border-color:var(--ink-2)}}

/* ---------- Impresión: una diapositiva por página ---------- */
@page{size:1280px 720px;margin:0}
@media print{
  :root:root:root{--bg:#F3F5F7;--bg-outer:#F3F5F7;--surface:#FFFFFF;--ink:#0F1D27;--ink-2:#465662;--line:#CFD7DD;--track:#E3E8EC;--data:#1E6E8C;--alert:#B3261E;--alert-soft:#F3D6D2;--warn:#84550A;--ok:#1B6A48;--dot:#B7C2CA;color-scheme:light}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #main{position:static!important;background:none!important}
  #viewport{position:static!important;overflow:visible!important}
  #stage{position:static!important;transform:none!important;width:auto!important;height:auto!important;overflow:visible!important;background:none!important}
  .slide{position:relative!important;inset:auto!important;visibility:visible!important;opacity:1!important;transform:none!important;width:1280px!important;height:720px!important;break-after:page;break-inside:avoid;background:var(--bg)}
  .slide:last-child{break-after:auto}
  #chrome,#progress,#toast,#notes,#overview{display:none!important}
}
.cv-logo{display:block;height:64px;width:auto;box-sizing:content-box;align-self:flex-start}
:root[data-theme="dark"] .cv-logo{background:#fff;padding:6px 12px;border-radius:8px}

.portrait .cv-logo{height:48px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
<script>
(function(){
'use strict';
/* ================= Datos (embebidos, sin fetch) ================= */
const DATA=JSON.parse(document.getElementById('data').textContent);
const Q=DATA.queries, INST=Q.institutional.rows[0], CAMP=Q.campus.rows.slice(), PROG=Q.programs.rows, CRIT=Q.critical_courses.rows, QU=Q.quality.rows[0];
const PV=DATA.report.provenance;
const FLOW=Q.institutional.source.evidenceFlow, FILES=Q.institutional.source.files;

/* ================= Formato ================= */
const fmtInt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtDec=(n,d)=>{const s=Number(n).toFixed(d).split('.');return (s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.'))+(s[1]?','+s[1]:'')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACC={INGENIERIA:'Ingeniería',INGENIERIAS:'Ingenierías',MATEMATICAS:'Matemáticas',TECNOLOGIA:'Tecnología',COMUNICACION:'Comunicación',BACTERIOLOGIA:'Bacteriología',PSICOLOGIA:'Psicología',GEOLOGIA:'Geología',ADMINISTRACION:'Administración',INSTRUMENTACION:'Instrumentación',MORFOFISIOLOGIA:'Morfofisiología',BASICAS:'Básicas',DISENO:'Diseño',INFORMATICA:'Informática',INFORMATICAS:'Informáticas',BOGOTA:'Bogotá',CUCUTA:'Cúcuta',ECONOMIA:'Economía',ESTRUCTURACION:'Estructuración',GRAFICA:'Gráfica',GRAFICO:'Gráfico',QUIRURGICA:'Quirúrgica',SUPERVISION:'Supervisión',METODOS:'Métodos',ANALISIS:'Análisis',SOCIOHUMANIDADES:'Sociohumanidades'};
const SMALL=new Set(['DE','DEL','LA','EL','LOS','LAS','Y','EN','A','E','O','PARA','CON','POR']);
const tc=s=>String(s);
const clamp=(a,b,v)=>Math.min(b,Math.max(a,v));

/* ================= Cifras derivadas (todo desde data.json) ================= */
const pctCrit=INST.cursos_ge_50/INST.cursos*100;
const campBy=CAMP.slice().sort((a,b)=>b.cursos_ge_50-a.cursos_ge_50);
const lead=campBy[0], leadShare=lead.cursos_ge_50/INST.cursos_ge_50*100;
const topRate=CAMP.slice().sort((a,b)=>b.tasa_reprobacion_pct-a.tasa_reprobacion_pct)[0];
const progTop=PROG.slice().sort((a,b)=>b.cursos_ge_50-a.cursos_ge_50||b.reprobados-a.reprobados);
const prog10=progTop.slice(0,10), progWith=PROG.filter(r=>r.cursos_ge_50>0), progWithout=PROG.length-progWith.length;
const top3=prog10.slice(0,3), top3Sum=top3.reduce((a,r)=>a+r.cursos_ge_50,0);
const byRate=CRIT.slice().sort((a,b)=>b.tasa_reprobacion_pct-a.tasa_reprobacion_pct||b.matriculados-a.matriculados);
const TOPN=7, crTop=byRate.slice(0,TOPN), ge90=CRIT.filter(r=>r.tasa_reprobacion_pct>=90).length;
const BANDS=[[50,60],[60,70],[70,80],[80,90],[90,101]].map(([a,b])=>({a,b,n:CRIT.filter(r=>r.tasa_reprobacion_pct>=a&&r.tasa_reprobacion_pct<b).length}));
const bandMax=Math.max(...BANDS.map(b=>b.n));
const matr=CRIT.map(r=>r.matriculados).sort((a,b)=>a-b);
const median=matr.length%2?matr[(matr.length-1)/2]:(matr[matr.length/2-1]+matr[matr.length/2])/2;
const small15=CRIT.filter(r=>r.matriculados<=15).length;
const pIdi=PROG.find(r=>/idiomas/i.test(r.programa)), pMor=PROG.slice().filter(r=>r.cursos_ge_50>0).sort((a,b)=>b.tasa_reprobacion_pct-a.tasa_reprobacion_pct)[0];
const pMat=PROG.find(r=>/^MATEMATICAS/.test(r.programa));
const shortCamp=c=>tc(c);

/* ================= Estado / utilidades de movimiento ================= */
const HAS=typeof window.gsap!=='undefined';
let RM=false;
const $=(s,r)=> (r||document).querySelector(s);
const SL=[];
function rise(tl,t,pos,o){o=o||{};tl.from(t,{autoAlpha:0,y:RM?0:(o.y!==undefined?o.y:16),duration:RM?.2:(o.d||.55),ease:'power4.out',stagger:RM?0:(o.s!==undefined?o.s:.07)},pos)}
function grow(tl,t,prop,pos,o){o=o||{};if(RM){tl.from(t,{autoAlpha:0,duration:.2},pos);return}
  const v={duration:o.d||.8,ease:'power4.out',stagger:o.s!==undefined?o.s:.09};v[prop]=0;v.transformOrigin=o.origin||'0 50%';tl.from(t,v,pos)}
function count(tl,el,to,dec,pos,d,suf){if(!el)return;const f=v=>fmtDec(v,dec||0)+(suf||'');
  if(RM||!HAS){el.textContent=f(to);return}
  el.textContent=f(0);const o={v:0};
  tl.to(o,{v:to,duration:d||1.1,ease:'power2.out',onUpdate:()=>{el.textContent=f(o.v)}},pos)}
const hdr=(tl,q)=>rise(tl,q('[data-h]'),0,{s:.08,y:14,d:.5});

/* ================= Diapositivas ================= */
function head(k,t,s){return `<header class="hd"><p class="kicker" data-h>${k}</p><h2 data-h>${t}</h2>${s?`<p class="sub" data-h>${s}</p>`:''}</header>`}
const ICON={
  scope:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  priv:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  calc:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></svg>'
};

/* 1 Portada */
SL.push({key:'cover',kicker:'Portada',fig:'≥ 50 %',title:'Mapa de riesgo académico: cursos con reprobación de 50 % o más',
 notes:`Universidad de Santander, periodo 2026-2, corte P1. Este informe responde: ¿qué cursos presentan reprobación de 50 % o más y en qué campus y programas se concentran? Aclarar desde el inicio que P1 es una alerta temprana y no un resultado definitivo. Fuente: ${FILES.join(' y ')}.`,
 html:()=>`<div class="cover"><div class="cv-left"><img class="cv-logo" data-h src="public/logo-udes.png" alt="Universidad de Santander UDES, vigilada Mineducación, SNIES 2832"><p class="kicker" data-h>Universidad de Santander · 2026-2 · Corte P1</p><h1 data-h>Mapa de riesgo académico</h1><p class="cv-sub" data-h>Cursos con reprobación de 50 % o más y dónde se concentran</p><p class="badge" data-h>Alertas tempranas, no resultados definitivos</p><p class="cv-sub" data-h style="font-size:20px;margin-top:22px">Elaborado por ${esc(PV.author)} · udes.edu.co</p></div><div class="cv-mark" aria-hidden="true"><span class="ge" data-m>≥</span><span class="n" data-m id="cvn">50</span><span class="pc" data-m>%</span></div></div><div class="cv-foot" data-f>${CAMP.map(c=>`<span>${esc(shortCamp(c.campus))}</span>`).join('')}</div>`,
 anim:(tl,q)=>{rise(tl,q('[data-h]'),0.05,{s:.1,y:20,d:.7});
  rise(tl,q('[data-m]'),0.15,{s:.06,y:30,d:.8});count(tl,q('#cvn')[0],50,0,0.15,1.2);rise(tl,q('[data-f] span'),0.7,{s:.08,y:8})}});

/* 2 Mensaje clave */
let dotCv=null; const dots={reveal:1,hot:1};
SL.push({key:'key',kicker:'Mensaje clave',fig:`${fmtInt(INST.cursos_ge_50)} de ${fmtInt(INST.cursos)}`,
 title:`${fmtInt(INST.cursos_ge_50)} de ${fmtInt(INST.cursos)} cursos tienen reprobación de 50 % o más`,
 sub:`Es el ${fmtDec(pctCrit,1)} % de los cursos, repartido en ${INST.programas_con_curso_ge_50} programas y ${INST.campus_con_curso_ge_50} campus.`,
 notes:`Qué pasa: ${INST.cursos_ge_50} de ${fmtInt(INST.cursos)} cursos superan el umbral de 50 % de reprobación en P1 (${fmtDec(pctCrit,2)} %). Por qué importa: al corte P1 los cortes P2 y P3 tienen cobertura de ${QU.p2_coverage_pct} %, así que es una señal temprana para seguir. El gráfico de puntos es una unidad por curso; los rojos van primero por orden, su posición no indica campus ni programa.`,
 html:function(){return head(this.kicker,this.title,this.sub)+`<div class="bd"><div class="dotcol"><div class="dotwrap" data-a><canvas id="dotcv" role="img" aria-label="${INST.cursos_ge_50} de ${INST.cursos} cursos con reprobación de 50 % o más"></canvas></div><p class="legend" data-a><span><i class="sw"></i>Un punto = un curso</span><span><i class="sw h"></i>Reprobación ≥ 50 % (${INST.cursos_ge_50})</span></p></div><div class="keycol"><div class="keybig" data-a><span class="num" id="k123">${INST.cursos_ge_50}</span><p>cursos por encima del umbral al corte P1</p></div><div class="why" data-a><span class="lab">Por qué importa</span><p>P1 es una alerta temprana: P2 y P3 aún no tienen datos (${QU.p2_coverage_pct} % de cobertura). Es el momento de mirar estos cursos, no de darlos por definitivos.</p></div></div></div>`},
 anim:(tl,q)=>{hdr(tl,q);rise(tl,q('.dotwrap,.legend'),0.1,{s:.1,y:10});
  if(RM||!HAS){dots.reveal=1;dots.hot=1;drawDots();}else{
   dots.reveal=0;dots.hot=0;
   tl.to(dots,{reveal:1,duration:1.3,ease:'power2.inOut',onUpdate:drawDots},0.2).to(dots,{hot:1,duration:.8,ease:'power4.out',onUpdate:drawDots},1.25)}
  rise(tl,q('.keybig,.why'),0.5,{s:.15,y:18});count(tl,q('#k123')[0],INST.cursos_ge_50,0,0.6,1.2)}});

/* 3 Indicadores */
SL.push({key:'kpi',kicker:'Indicadores institucionales',fig:`${fmtDec(INST.tasa_reprobacion_pct,2)} %`,
 title:`Reprobó el ${fmtDec(INST.tasa_reprobacion_pct,2)} % de las matrículas por curso en P1`,
 sub:`${fmtInt(INST.reprobados)} reprobados sobre ${fmtInt(INST.matriculados_curso)} matrículas por curso.`,
 notes:`Reprobación P1 es nota inferior a 3,0. La tasa institucional es ${fmtDec(INST.tasa_reprobacion_pct,2)} %: ${fmtInt(INST.reprobados)} reprobados sobre ${fmtInt(INST.matriculados_curso)} matrículas por curso, en ${fmtInt(INST.cursos)} cursos. De ellos, ${INST.cursos_ge_50} están en 50 % o más; ${INST.programas_con_curso_ge_50} programas y ${INST.campus_con_curso_ge_50} campus tienen al menos uno. Nota: la base de estudiantes tiene ${fmtInt(QU.student_rows)} filas y la de grupos suma ${fmtInt(INST.matriculados_curso)} matrículas; el cálculo usa la base de grupos.`,
 html:function(){const t=(v,l,c)=>`<div class="tile ${c||''}" data-a><span class="num" data-c="${v}">${fmtInt(v)}</span><span>${l}</span></div>`;
  return head(this.kicker,this.title,this.sub)+`<div class="bd"><div class="donutwrap" data-a role="img" aria-label="Tasa de reprobación ${fmtDec(INST.tasa_reprobacion_pct,2)} %"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="86"/><circle class="vl" id="dv" cx="100" cy="100" r="86" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100-INST.tasa_reprobacion_pct}"/></svg><div class="dcenter"><span class="num" id="dn">${fmtDec(INST.tasa_reprobacion_pct,2)} %</span><span>tasa de reprobación institucional</span></div></div><div class="tiles">${t(INST.matriculados_curso,'matrículas por curso')}${t(INST.reprobados,'reprobados (nota inferior a 3,0)')}${t(INST.cursos,'cursos en el corte P1')}${t(INST.cursos_ge_50,'cursos con reprobación ≥ 50 %','hot')}</div></div>`},
 anim:(tl,q)=>{hdr(tl,q);
  if(RM){tl.from(q('.donutwrap'),{autoAlpha:0,duration:.2},0.1)}else{tl.from(q('#dv'),{strokeDashoffset:100,duration:1.1,ease:'power4.out'},0.15).from(q('.dcenter'),{autoAlpha:0,duration:.5},0.3)}
  count(tl,q('#dn')[0],INST.tasa_reprobacion_pct,2,0.2,1.1,' %');
  rise(tl,q('.tile'),0.3,{s:.09,y:20});
  q('.tile .num').forEach((el,i)=>{count(tl,el,+el.dataset.c,0,0.4+i*.09,1.1)})}});

/* 4 Campus */
SL.push({key:'campus',kicker:'Comparativo por campus',fig:`${lead.cursos_ge_50} en ${tc(lead.campus)}`,
 title:`${tc(lead.campus)} concentra ${lead.cursos_ge_50} de los ${INST.cursos_ge_50} cursos con reprobación ≥ 50 %`,
 sub:`Es el ${fmtDec(leadShare,0)} % de los cursos priorizados. Más cursos no siempre significa mayor tasa.`,
 notes:`Por campus: ${campBy.map(c=>`${tc(c.campus)} ${c.cursos_ge_50} cursos ≥ 50 % de ${fmtInt(c.cursos)} (tasa ${fmtDec(c.tasa_reprobacion_pct,2)} %)`).join('; ')}. Las dos columnas de barras tienen escalas distintas: la primera cuenta cursos, la segunda es una tasa en porcentaje.`,
 html:function(){const mx=lead.cursos_ge_50, tm=15;
  return head(this.kicker,this.title,this.sub)+`<div class="bd"><div class="rows"><div class="rowhead" data-a><span class="lab">Campus</span><span class="lab al">Cursos con reprobación ≥ 50 %</span><span class="lab dt">Tasa de reprobación del campus</span></div>${campBy.map(c=>`<div class="crow" data-a><div class="nm">${esc(tc(c.campus))}<small>${fmtInt(c.cursos)} cursos · ${fmtInt(c.matriculados_curso)} matrículas</small></div><div class="bcell" data-l="Cursos ≥ 50 %"><div class="track"><i class="fill a" data-b style="width:${c.cursos_ge_50/mx*100}%"></i></div><span class="v al" data-c="${c.cursos_ge_50}" data-d="0">${c.cursos_ge_50}</span></div><div class="bcell" data-l="Tasa"><div class="track"><i class="fill" data-b style="width:${c.tasa_reprobacion_pct/tm*100}%"></i></div><span class="v dt" data-c="${c.tasa_reprobacion_pct}" data-d="2">${fmtDec(c.tasa_reprobacion_pct,2)}</span></div></div>`).join('')}<p class="note" data-a><b>Lectura:</b> ${esc(tc(topRate.campus))} tiene la tasa más alta (${fmtDec(topRate.tasa_reprobacion_pct,2)} %) pero solo ${topRate.cursos_ge_50} cursos ≥ 50 % sobre ${topRate.cursos}. Escala de la tasa: 0 a 15 %.</p></div></div>`},
 anim:(tl,q)=>{hdr(tl,q);rise(tl,q('.rowhead'),0.1,{y:8});rise(tl,q('.crow'),0.15,{s:.1,y:14});grow(tl,q('[data-b]'),'scaleX',0.3,{s:.05,d:.9});
  q('[data-c]').forEach((el,i)=>count(tl,el,+el.dataset.c,+el.dataset.d,0.35+i*.05,.9));rise(tl,q('.note'),0.9,{y:8})}});

/* 5 Programas */
SL.push({key:'prog',kicker:'Programas con más cursos ≥ 50 %',fig:`${top3Sum} en 3 programas`,
 title:`Tres programas de ${tc(top3[0].campus)} suman ${top3Sum} de los ${INST.cursos_ge_50} cursos`,
 sub:`${progWith.length} programas tienen al menos un curso con reprobación ≥ 50 %; ${progWithout} no tienen ninguno.`,
 notes:`Los tres primeros son ${top3.map(r=>tc(r.programa)+' ('+r.cursos_ge_50+')').join(', ')}. La tasa del programa mide todos sus cursos, no solo los críticos. Programas con el mismo nombre en campus distintos (p. ej. Medicina Veterinaria) se muestran por separado.`,
 html:function(){const mx=prog10[0].cursos_ge_50;

const stage=$('#stage'), vp=$('#viewport'), main=$('#main'), root=document.documentElement;

/* ================= Lienzo de puntos ================= */
let printing=false, S=1;
function cssCol(n){return getComputedStyle(root).getPropertyValue(n).trim()}
function sizeCanvas(){if(!dotCv)return;const w=dotCv.clientWidth,h=dotCv.clientHeight;if(!w||!h)return;const k=Math.max(1,S*(window.devicePixelRatio||1)*(printing?2:1));dotCv.width=Math.round(w*k);dotCv.height=Math.round(h*k);drawDots()}
function drawDots(){const c=dotCv;if(!c)return;const w=c.clientWidth,h=c.clientHeight;if(!w||!h||!c.width)return;const ctx=c.getContext('2d'),k=c.width/w;ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,w,h);
  const n=INST.cursos,H=INST.cursos_ge_50,cols=Math.max(1,Math.round(Math.sqrt(n*w/h))),rows=Math.ceil(n/cols),cell=Math.min(w/cols,h/rows),r=cell*.36,ox=(w-cell*cols)/2,oy=(h-cell*rows)/2;
  const cd=printing?'#B7C2CA':cssCol('--dot'),ca=printing?'#B3261E':cssCol('--alert'),vis=dots.reveal*(n+40),tau=Math.PI*2;
  for(let i=0;i<n;i++){const a=clamp(0,1,(vis-i)/40);if(a<=0)break;const x=ox+(i%cols+.5)*cell,y=oy+(Math.floor(i/cols)+.5)*cell;
    ctx.globalAlpha=a;ctx.fillStyle=cd;ctx.beginPath();ctx.arc(x,y,r,0,tau);ctx.fill();
    if(i<H&&dots.hot>0){ctx.globalAlpha=a*dots.hot;ctx.fillStyle=ca;ctx.beginPath();ctx.arc(x,y,r*(1+.25*dots.hot),0,tau);ctx.fill()}}
  ctx.globalAlpha=1}

/* ================= Escalado 16:9 / vertical ================= */
let portrait=false, nh=0;
function layout(force){const vw=vp.clientWidth,vh=vp.clientHeight;if(!vw||!vh)return;
  const p=vw/vh<1;let W,H;if(p){W=640;H=clamp(900,1500,Math.round(640*vh/vw))}else{W=1280;H=720}
  S=Math.min(vw/W,vh/H);const ox=(vw-W*S)/2,oy=(vh-H*S)/2;
  stage.style.width=W+'px';stage.style.height=H+'px';stage.style.transform=`translate(${ox}px,${oy}px) scale(${S})`;
  if(p!==portrait||force){portrait=p;root.classList.toggle('portrait',p);return true}return false}
let rz=0;function onResize(){cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{layout();sizeCanvas()})}
if('ResizeObserver' in window){new ResizeObserver(onResize).observe(vp)}else{addEventListener('resize',onResize)}

const vis=el=>HAS?gsap.getProperty(el,'autoAlpha'):(el.style.visibility==='visible'?1:0);
function hide(d){show(d.el,0);if(HAS)gsap.set(d.el,{x:0});d.el.setAttribute('aria-hidden','true');if(d.tl)d.tl.pause(0)}
function go(n,o){o=o||{};n=clamp(0,N-1,n);if(n===cur&&!o.force)return;
  const from=cur>=0?SL[cur]:null,to=SL[n],dir=n>cur?1:-1;
  if(HAS){SL.forEach((d,i)=>{if(i!==cur&&i!==n&&vis(d.el)>0){gsap.killTweensOf(d.el);hide(d)}});}else{SL.forEach(hide)}
  if(from&&from!==to){if(from.tl)from.tl.pause();from.el.setAttribute('aria-hidden','true');
    if(HAS){gsap.to(from.el,{autoAlpha:0,x:(RM?0:-dir*36),duration:RM?.15:.26,ease:'power3.out',overwrite:true,onComplete:()=>{if(cur!==SL.indexOf(from))hide(from)}})}}
  cur=n;to.el.setAttribute('aria-hidden','false');
  const v=vis(to.el),wasVisible=v>.05;
  if(HAS){gsap.killTweensOf(to.el);if(!wasVisible)gsap.set(to.el,{x:RM?0:dir*48});
    gsap.to(to.el,{autoAlpha:1,x:0,duration:RM?.2:.5,ease:'power4.out',overwrite:true});
    if(to.tl){if(o.initial||!wasVisible||to.tl.progress()===0)to.tl.restart();else to.tl.play()}}
  else{show(to.el,1)}
  count$.textContent=`${n+1} / ${N}`;
  if(HAS)gsap.to(bar,{scaleX:(n+1)/N,duration:RM?.01:.5,ease:'power4.out',overwrite:true});else bar.style.transform=`scaleX(${(n+1)/N})`;
  live.textContent=`Diapositiva ${n+1} de ${N}: ${to.title}`;
  $('#bPrev').disabled=n===0;$('#bNext').disabled=n===N-1;$('#bPrev').style.opacity=n===0?.35:1;$('#bNext').style.opacity=n===N-1?.35:1;
  cardsEl.querySelectorAll('.card').forEach((c,i)=>c.setAttribute('aria-current',i===n?'true':'false'));
  updateNotes();
  try{history.replaceState(null,'','#'+(n+1))}catch(e){}
}

  const st={h:nh};
  const apply=()=>{nh=st.h;notesEl.style.height=nh+'px';main.style.bottom=nh+'px';layout()};
  if(HAS&&!RM){gsap.to(st,{h:target,duration:.35,ease:'power4.out',overwrite:true,onUpdate:apply,onComplete:()=>{apply();if(!notesOpen)notesEl.style.visibility='hidden';sizeCanvas()}})}
  else{st.h=target;apply();if(!notesOpen)notesEl.style.visibility='hidden';sizeCanvas()}}
$('#bNotes').addEventListener('click',toggleNotes);

/* Índice con Flip */
const ov=$('#overview');
function openOv(){if(ovOpen)return;ovOpen=true;ov.style.visibility='visible';
  if(HAS){gsap.killTweensOf(ov);gsap.to(ov,{autoAlpha:1,duration:RM?.1:.2,ease:'power3.out'});
    if(!RM&&window.Flip){gsap.registerPlugin(window.Flip);const cs=[...cardsEl.children];cardsEl.classList.add('stack');const st=Flip.getState(cs);cardsEl.classList.remove('stack');Flip.from(st,{duration:.55,ease:'power4.out',stagger:.03,overwrite:true})}}
  else{ov.style.opacity=1}
  const c=cardsEl.children[cur];if(c)c.focus({preventScroll:false})}
function closeOv(){if(!ovOpen)return;ovOpen=false;
  if(HAS){gsap.killTweensOf(ov);gsap.to(ov,{autoAlpha:0,duration:.18,ease:'power3.out'})}else{ov.style.opacity=0;ov.style.visibility='hidden'}
  vp.focus({preventScroll:true})}
$('#bOv').addEventListener('click',()=>ovOpen?closeOv():openOv());$('#ovClose').addEventListener('click',closeOv);

/* Pantalla completa, tema, aviso */
const toastEl=$('#toast');let toastT;
function toast(msg,ms){toastEl.textContent=msg;if(HAS){gsap.killTweensOf(toastEl);gsap.fromTo(toastEl,{autoAlpha:0,y:RM?0:8},{autoAlpha:1,y:0,duration:.25,ease:'power3.out'});clearTimeout(toastT);toastT=setTimeout(()=>gsap.to(toastEl,{autoAlpha:0,duration:.25}),ms||2600)}}
function fs(){try{if(document.fullscreenElement){document.exitFullscreen()}else{const p=root.requestFullscreen&&root.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('Pantalla completa no disponible en este visor'));else toast('Pantalla completa no disponible en este visor')}}catch(e){toast('Pantalla completa no disponible en este visor')}}
$('#bFs').addEventListener('click',fs);
$('#bPdf').addEventListener('click',()=>{toast('En el diálogo de impresión elige “Guardar como PDF”');setTimeout(()=>window.print(),350)});
function toggleTheme(){const dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const nx=dark?'light':'dark';root.setAttribute('data-theme',nx);try{localStorage.setItem('udes-pres-theme',nx)}catch(e){}requestAnimationFrame(drawDots)}
try{const sv=localStorage.getItem('udes-pres-theme');if(sv)root.setAttribute('data-theme',sv)}catch(e){}
$('#bTheme').addEventListener('click',toggleTheme);

/* Teclado */
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
  if(ovOpen){if(k==='Escape'||k==='o'||k==='O'){e.preventDefault();closeOv()}
    else if(/^Arrow/.test(k)){e.preventDefault();const cs=[...cardsEl.children];let i=cs.indexOf(document.activeElement);if(i<0)i=cur;const cols=getComputedStyle(cardsEl).gridTemplateColumns.split(' ').length||1;
      i=clamp(0,cs.length-1,i+(k==='ArrowRight'?1:k==='ArrowLeft'?-1:k==='ArrowDown'?cols:-cols));cs[i].focus()}
    return}
  const onBtn=e.target&&e.target.closest&&e.target.closest('button');if(onBtn&&(k==='Enter'||k===' '))return;
  switch(k){
    case 'ArrowRight':case 'ArrowDown':case 'PageDown':case ' ':case 'Enter':e.preventDefault();next();break;
    case 'ArrowLeft':case 'ArrowUp':case 'PageUp':case 'Backspace':e.preventDefault();prev();break;
    case 'Home':e.preventDefault();go(0);break;case 'End':e.preventDefault();go(N-1);break;
    case 'o':case 'O':e.preventDefault();openOv();break;
    case 'f':case 'F':e.preventDefault();fs();break;
    case 'n':case 'N':e.preventDefault();toggleNotes();break;
    case 't':case 'T':e.preventDefault();toggleTheme();break;
  }});

/* Clic/tap y deslizamiento con seguimiento 1:1 */
let drag=null,noClick=false;
vp.addEventListener('pointerdown',e=>{if(ovOpen||e.button>0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,t:e.timeStamp,dx:0,dy:0,mode:null,type:e.pointerType,vx:0,lx:e.clientX,lt:e.timeStamp}});
vp.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;
  const dt=e.timeStamp-drag.lt;if(dt>0){drag.vx=(e.clientX-drag.lx)/dt;drag.lx=e.clientX;drag.lt=e.timeStamp}
  if(!drag.mode&&Math.hypot(drag.dx,drag.dy)>10){drag.mode=Math.abs(drag.dx)>=Math.abs(drag.dy)?'x':'y';if(drag.type!=='mouse'){try{vp.setPointerCapture(e.pointerId)}catch(_){}}}
  if(drag.mode==='x'&&drag.type!=='mouse'&&HAS&&!RM){let dx=drag.dx;const edge=(cur===0&&dx>0)||(cur===N-1&&dx<0);if(edge)dx*=.3;
    gsap.killTweensOf(SL[cur].el,'x');gsap.set(SL[cur].el,{x:dx/S,autoAlpha:1-Math.min(.5,Math.abs(dx)/vp.clientWidth)})}});
function endDrag(e,cancel){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;
  const w=vp.clientWidth,h=vp.clientHeight;let fired=false;
  if(!cancel&&d.mode==='x'){const v=d.vx;if(Math.abs(d.dx)>w*.16||Math.abs(v)>.5){if(d.dx<0&&cur<N-1){next();fired=true}else if(d.dx>0&&cur>0){prev();fired=true}}}
  else if(!cancel&&d.mode==='y'&&portrait&&d.type!=='mouse'&&Math.abs(d.dy)>h*.14){if(d.dy<0)next();else prev();fired=true}
  if(d.mode){noClick=true;setTimeout(()=>{noClick=false},60);
    if(!fired&&HAS)gsap.to(SL[cur].el,{x:0,autoAlpha:1,duration:RM?.1:.45,ease:'power4.out',overwrite:true})}}
vp.addEventListener('pointerup',e=>endDrag(e,false));vp.addEventListener('pointercancel',e=>endDrag(e,true));
vp.addEventListener('click',e=>{if(noClick||ovOpen)return;if(e.target.closest('[data-interactive]'))return;const r=vp.getBoundingClientRect();(e.clientX-r.left)<r.width*.28?prev():next()});

/* Cromo que se oculta en reposo (solo con puntero) */
const chrome=$('#chrome');let idle;function wake(){chrome.classList.remove('idle');clearTimeout(idle);if(matchMedia('(hover:hover)').matches&&!ovOpen)idle=setTimeout(()=>chrome.classList.add('idle'),3200)}
['pointermove','pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,wake,{passive:true}));

/* ================= Impresión ================= */
addEventListener('beforeprint',()=>{printing=true;root.classList.remove('portrait');
  SL.forEach(d=>{if(d.tl)d.tl.progress(1)});dots.reveal=1;dots.hot=1;void stage.offsetWidth;sizeCanvas()});
addEventListener('afterprint',()=>{printing=false;layout(true);sizeCanvas();SL.forEach((d,i)=>{if(i!==cur)hide(d)})});

/* ================= Movimiento con matchMedia (prefers-reduced-motion) ================= */
function buildTimelines(){
  SL.forEach(d=>{if(d.tl){d.tl.kill();d.tl=null}});
  if(!HAS)return;
  SL.forEach(d=>{const tl=gsap.timeline({paused:true,defaults:{ease:'power4.out'}});d.anim(tl,gsap.utils.selector(d.el));d.tl=tl});
}
if(HAS){
  if(window.Flip)gsap.registerPlugin(window.Flip);
  const mm=gsap.matchMedia();
  mm.add({reduce:'(prefers-reduced-motion: reduce)',full:'(prefers-reduced-motion: no-preference)'},ctx=>{
    RM=!!ctx.conditions.reduce;
    buildTimelines();
    if(cur>=0){SL.forEach((d,i)=>{if(!d.tl)return;if(i===cur)d.tl.progress(1);else d.tl.progress(0)})}
    return()=>{};
  });
}
layout(true);
if(!HAS){SL.forEach(d=>{d.tl=null})}
const start=parseInt((location.hash||'').replace('#',''),10);
go(isNaN(start)?0:clamp(0,N-1,start-1),{initial:true,force:true});
sizeCanvas();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{sizeCanvas()});
wake();
setTimeout(()=>toast('← → o espacio: navegar · O: índice · F: pantalla completa · N: notas',4200),900);
})();
</script>
